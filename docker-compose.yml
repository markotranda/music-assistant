services:
  music-assistant:
    build: .
    image: music-assistant:local
    container_name: music-assistant
    ports:
      - "8787:8787"
    # Copy .env.example to .env and fill in your keys. Never commit .env.
    env_file:
      - .env
    environment:
      PORT: "8787"
      MA_WEB_DIR: ./web
    volumes:
      # SQLite database and app state.
      - ./data:/app/data
      # Your managed music collection (NN - Title files per band).
      - ./collection:/app/collection
    restart: unless-stopped
