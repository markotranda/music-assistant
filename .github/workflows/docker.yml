name: Docker

# Shared multi-arch build + publish. Called by Release (manual v* tags) and
# Version (auto patch tags from main) — both pass a version, this publishes
# ghcr.io/<repo>:{version} + {major}.{minor} + latest.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish, with or without a leading v (e.g. 1.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize version
        id: ver
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "majorMinor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.majorMinor }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
