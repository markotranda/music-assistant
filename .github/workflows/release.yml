name: Release

# Manual releases: push a v* tag (e.g. git tag v1.2.0 && git push origin v1.2.0)
# and the image is published as 1.2.0 + 1.2 + latest. Routine pushes to main
# are versioned automatically by version.yml instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  docker:
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ github.ref_name }}
